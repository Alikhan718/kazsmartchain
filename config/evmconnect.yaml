# EVMConnect Configuration for KazSmartChain
# Docs: https://github.com/hyperledger/firefly-evmconnect

log:
  level: debug

# Blockchain connection - через FireFly Signer!
# Signer подписывает транзакции и отправляет в Besu
connector:
  url: http://firefly-signer:8545

# Persistence for checkpoints
persistence:
  leveldb:
    path: /evmconnect/data

# FireFly Core connection  
ffcore:
  url: http://firefly:5000
  namespaces:
    - default

# Confirmations (0 for dev mode)
confirmations:
  required: 0

# ============================================
# Transaction Signing via Besu (dev mode)
# Besu dev-mode has unlocked accounts
# Uses eth_sendTransaction (node signs)
# ============================================

# Policy engine - transactions go to Besu which signs them
#policyengine.simple:
 # fixedGasPrice: 0       # Dev mode - zero gas price
  #gasOracle:
   # mode: fixed

transactions:
  handler:
    name: simple
    simple:
#      fixedGasPrice: 0
      gasOracle:
        mode: connector


# API Server
api:
  port: 5008
  address: 0.0.0.0
