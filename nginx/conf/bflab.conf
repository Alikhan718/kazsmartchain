server {
    listen 80;
    server_name bflab.nu.edu.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name bflab.nu.edu.kz;

    ssl_certificate /etc/letsencrypt/live/bflab.nu.edu.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bflab.nu.edu.kz/privkey.pem;

    location / {
        proxy_pass http://lab-landing-container:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
