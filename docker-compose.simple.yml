# Запуск: docker-compose -f docker-compose.simple.yml up -d

services:
  # ========================================
  # Базовая инфраструктура
  # ========================================
  
  postgres:
    image: postgres:15
    container_name: kaz-postgres
    environment:
      POSTGRES_USER: kaz
      POSTGRES_PASSWORD: kazpass
      POSTGRES_DB: kazsmartchain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kaz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # IPFS - Децентрализованное хранилище
  # ========================================
  
  ipfs:
    image: ipfs/kubo:latest
    container_name: kaz-ipfs
    environment:
      IPFS_PROFILE: server
    ports:
      - "5001:5001"  # API
      - "8080:8080"  # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    command: ["daemon", "--migrate=true", "--agent-version-suffix=docker"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/api/v0/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Hyperledger Besu - Ethereum блокчейн
  # ========================================
  
  besu:
    image: hyperledger/besu:latest
    container_name: kaz-besu
    command:
      - "--network=dev"
      - "--data-path=/data"
      - "--rpc-http-enabled=true"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-http-port=8545"
      - "--rpc-http-api=ETH,NET,WEB3,ADMIN,MINER,DEBUG"
      - "--rpc-http-cors-origins=*"
      - "--host-allowlist=*"
      - "--miner-enabled=true"
      - "--miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73"
      - "--min-gas-price=0"
    ports:
      - "8545:8545"
    volumes:
      - besu_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========================================
  # FireFly Signer - Transaction Signing
  # Signs transactions before sending to Besu
  # ========================================
  
  firefly-signer:
    image: ghcr.io/hyperledger/firefly-signer:latest
    container_name: kaz-signer
    command: ["-f", "/etc/signer/config.yaml"]
    ports:
      - "8555:8545"
    volumes:
      - ./config/firefly-signer.yaml:/etc/signer/config.yaml:ro
      - ./config/keys:/keys:ro
    depends_on:
      - besu
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8545/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ========================================
  # Hyperledger FireFly - Blockchain Gateway
  # ========================================
  
  # ========================================
  # EVMConnect - Blockchain Connector
  # ========================================
  
  evmconnect:
    image: ghcr.io/hyperledger/firefly-evmconnect:latest
    container_name: kaz-evmconnect
    user: "0:0"  # Run as root to avoid permission issues
    command: ["-f", "/evmconnect/config.yaml"]
    ports:
      - "5008:5008"
    volumes:
      - evmconnect_data:/evmconnect/data
      - ./config/evmconnect.yaml:/evmconnect/config.yaml:ro
    depends_on:
      - firefly-signer  # Теперь через signer
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5008/eventstreams"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========================================
  # Hyperledger FireFly - Blockchain Gateway
  # ========================================
  
  firefly:
    image: ghcr.io/hyperledger/firefly:latest
    container_name: kaz-firefly
    command: ["-f", "/etc/firefly/firefly.core.yaml"]
    ports:
      - "5000:5000"
    volumes:
      - firefly_data:/data
      - ./config/firefly.core.yaml:/etc/firefly/firefly.core.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      besu:
        condition: service_started
      ipfs:
        condition: service_started
      evmconnect:
        condition: service_started
      fftokens:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ========================================
  # FFTokens - Token Connector (ERC-20/ERC-721)
  # ========================================
  
  fftokens:
    image: ghcr.io/hyperledger/firefly-tokens-erc20-erc721:latest
    container_name: kaz-fftokens
    ports:
      - "3001:3000"  # ← Исправлено на 3001 (как в firefly.core.yaml)
    environment:
      ETHCONNECT_URL: http://evmconnect:5008  # ← Правильная переменная для fftokens
      ETHCONNECT_TOPIC: "tokens"  # ← Уникальный топик для tokens!
      AUTO_INIT: "false"  # Как в FireFly CLI
      LOG_LEVEL: debug
    depends_on:
      - evmconnect
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========================================
  # Solana - Devnet (реальный)
  # ========================================
  
  solana-validator:
    image: solanalabs/solana:stable
    container_name: kaz-solana
    command:
      - solana-test-validator
      - --no-bpf-jit
      - --rpc-bind-address=0.0.0.0
      - --rpc-port=8899
      - --limit-ledger-size=10000000
    ports:
      - "8899:8899"  # RPC
      - "8900:8900"  # PubSub
      - "9900:9900"  # Faucet
    volumes:
      - solana_data:/data
    healthcheck:
      test: ["CMD", "solana", "cluster-version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ========================================
  # API - NestJS Backend
  # ========================================
  
  api:
    image: node:20
    container_name: kaz-api
    working_dir: /srv/apps/api
    volumes:
      - ./:/srv
      - node_modules_api:/srv/apps/api/node_modules
      - node_modules_sdk:/srv/packages/sdk/node_modules
      - node_modules_root_api:/srv/node_modules
    environment:
      NODE_ENV: development
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      NODE_PATH: /srv/apps/api/node_modules:/srv/packages/sdk/node_modules
      
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: kaz
      POSTGRES_PASSWORD: kazpass
      POSTGRES_DB: kazsmartchain
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # FireFly (используем имя контейнера вместо host.docker.internal)
      FIREFLY_BASE_URL: http://firefly:5000
      FIREFLY_NAMESPACE: default
      
      # Besu
      BESU_RPC_URL: http://besu:8545
      
      # IPFS
      IPFS_BASE_URL: http://ipfs:5001
      
      # Solana
      SOLANA_RPC_URL: http://solana-validator:8899
      
      # API
      API_PORT: 4000
      API_HOST: 0.0.0.0
      API_JWT_SECRET: dev-secret-change-in-production
      
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - firefly
      - solana-validator
    entrypoint: ["/bin/bash", "/srv/scripts/docker-entrypoint-api.sh"]

  # ========================================
  # Web - Next.js Frontend
  # ========================================
  
  web:
    image: node:20
    container_name: kaz-web
    working_dir: /srv
    volumes:
      - ./:/srv
      - node_modules_web:/srv/apps/web/node_modules
      - node_modules_sdk:/srv/packages/sdk/node_modules
      - node_modules_root:/srv/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_SOLANA_CLUSTER: devnet
      NEXT_PUBLIC_RELAY_BASE_URL: http://localhost:4100
      PORT: 3000
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    entrypoint: ["/bin/bash", "/srv/scripts/docker-entrypoint-web.sh"]

volumes:
  pgdata:
  ipfs_data:
  besu_data:
  firefly_data:
  evmconnect_data:
  solana_data:
  node_modules_api:
  node_modules_web:
  node_modules_sdk:
  node_modules_root:
  node_modules_root_api:

networks:
  default:
    name: kazsmartchain-network

